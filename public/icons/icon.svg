<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0494A8"/>
      <stop offset="42%" stop-color="#0E293A"/>
      <stop offset="100%" stop-color="#23BA69"/>
    </linearGradient>
    <radialGradient id="tcVignette" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <!-- Background (gradient) -->
  <rect width="512" height="512" rx="96" fill="url(#tcGrad)"/>
  <rect width="512" height="512" rx="96" fill="url(#tcVignette)"/>

  <!-- Subtle inner card -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>

  <!-- Accent "roof/leaf" mark -->
  <path d="M256 126 L362 228 L150 228 Z" fill="#567967" opacity="0.92"/>

  <!-- Primary letter -->
  <text x="50%" y="64%" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
        font-size="240" font-weight="800"
        fill="#567967">T</text>

  <!-- Small dot accent -->
  <circle cx="352" cy="372" r="12" fill="#C9A79E"/>
</svg>
